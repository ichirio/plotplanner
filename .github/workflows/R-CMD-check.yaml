# Standard R-CMD-check workflow, derived from r-lib/actions examples.
# Matrix covers the platforms and R versions CRAN expects, plus the two
# ggplot2 lines figure designs are written for (3.5.x and 4.0.x; see
# inst/fig/ggplot2_compat.csv).
# ggsurvfit >= 1.2.0 needs ggplot2 >= 4.0.0, so the 3.5.2 row pins ggsurvfit 1.1.0.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) ${{ matrix.config.gg || '' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel',     http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release', gg: 'ggplot2@3.5.2 ggsurvfit@1.1.0', want: '3.5.2'}
          - {os: ubuntu-latest,  r: 'release', gg: 'ggplot2@>=4.0.0', want: '4.0'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.gg || 'any::ggplot2' }}
          needs: check

      - name: Confirm the ggplot2 under test
        if: matrix.config.want
        run: |
          v <- as.character(packageVersion("ggplot2")); message("ggplot2 ", v)
          stopifnot(startsWith(v, "${{ matrix.config.want }}"))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        env:
          TFLSPEC_GGPLOT2_UNDER_TEST: ${{ matrix.config.want }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
